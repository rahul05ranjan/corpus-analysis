# corpus-analysis is stdlib-only. ruff is the one dev-time tool and never a
# runtime import.
line-length = 100
target-version = "py310"

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = [
    "E501",  # line length is enforced by review, not by a hard error
]

[lint.per-file-ignores]
# Tests run under PYTHONPATH=src, so imports follow the path setup in the
# Makefile rather than an install step.
"tests/*" = ["E402"]
"bin/*" = ["E402"]
