[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-analysis"
version = "0.2.0"
description = "Agent transcript corpora as inspectable evidence with exact provenance"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["transcripts", "provenance", "evaluation", "agents", "corpus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# No runtime dependencies, and that is a feature: this tool reads a corpus that
# contains whatever was pasted into a session. A short stdlib-only program is
# one a user can audit before pointing it at that.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
corpus-scan = "corpus_analysis.cli:main"
corpus-audit = "corpus_analysis.audit_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
